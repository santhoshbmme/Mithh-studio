kind = "web"
previewPath = "/"
title = "Mithraa Studio"
version = "1.0.0"
id = "artifacts/mithraa-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19285

[services.development]
run = "pnpm --filter @workspace/mithraa-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mithraa-studio", "run", "build" ]
publicDir = "artifacts/mithraa-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19285"
BASE_PATH = "/"
