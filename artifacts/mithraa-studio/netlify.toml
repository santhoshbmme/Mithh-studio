[build]
  base    = "artifacts/mithraa-studio"
  command = "npm install --legacy-peer-deps && vite build --config vite.config.ts"
  publish = "artifacts/mithraa-studio/dist/public"

[build.environment]
  PORT      = "8080"
  BASE_PATH = "/"
  NODE_VERSION = "20"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
